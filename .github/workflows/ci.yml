name: macOS build and core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --disable-sandbox
      - name: Release compilation
        run: swift build --configuration release --disable-sandbox
